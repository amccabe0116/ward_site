<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ward</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1b2a41">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231b2a41'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23e2c377' font-family='Georgia'>N</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css?v=18">
</head>
<body>
  <!-- GitHub Pages serves this for any missing path. A post link (e/<id>) whose page the script
       hasn't published yet — a post approved a minute ago — still shows the post here; anything
       else gets a plain "not found". -->
  <header class="hero compact">
    <a class="back" href="/">‹ Home</a>
    <p class="eyebrow">Ward</p>
    <h1 id="h">What’s happening</h1>
  </header>

  <main class="wrap">
    <div id="post"><p class="empty">Loading…</p></div>
    <p class="cal-hint" style="margin-top:18px"><a href="/">Everything that’s coming up</a> · <a href="/calendar.html">Subscribe to the ward calendar</a></p>
  </main>

  <script src="/config.js"></script>
  <script src="/app.js?v=4"></script>
  <script src="/posts.js?v=13"></script>
  <script>
    (function () {
      const box = document.getElementById('post');
      const m = location.pathname.match(/^\/e\/(\d+)/);
      const notFound = msg => { document.getElementById('h').textContent = 'Not found'; box.innerHTML = ''; box.appendChild(NP.el('p', { class: 'empty' }, msg)); };
      if (!m) return notFound('There’s nothing at this address.');
      const id = Number(m[1]);
      NP.rpc('posts_public').then(rows => {
        const p = (rows || []).find(x => x.id === id);
        if (!p) return notFound('That announcement isn’t up any more — it may have already happened.');
        document.title = p.title + ' · Ward';
        document.getElementById('h').textContent = p.event_date ? 'Coming up' : 'Announcement';
        box.innerHTML = ''; box.appendChild(NPPosts.card(p));
      }).catch(() => notFound('Could not load that announcement.'));
    })();
  </script>
</body>
</html>
